name: Auto Release on Firebase Tools Update

on:
  schedule:
    # Check for new firebase-tools versions every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.compare.outputs.should_release }}
      version: ${{ steps.npm-version.outputs.latest }}
      repo_version: ${{ steps.repo-version.outputs.latest }}

    steps:
      - name: Verify release ref
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::Auto releases must run from master."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Get latest firebase-tools version from npm
        id: npm-version
        run: .github/scripts/get-npm-version.sh

      - name: Get latest release version from this repo
        id: repo-version
        run: .github/scripts/get-repo-version.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compare versions
        id: compare
        env:
          NPM_VERSION: ${{ steps.npm-version.outputs.latest }}
          REPO_VERSION: ${{ steps.repo-version.outputs.latest }}
        run: |
          echo "Comparing versions:"
          echo "  npm: $NPM_VERSION"
          echo "  repo: $REPO_VERSION"

          if [ "$NPM_VERSION" != "$REPO_VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: v$NPM_VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No new version. Current version: $REPO_VERSION"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yaml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  release:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit version pins and create release
        run: .github/scripts/create-release.sh "${{ needs.check.outputs.version }}" "${{ needs.check.outputs.repo_version }}"
        env:
          GH_TOKEN: ${{ github.token }}
