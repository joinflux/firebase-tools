name: Release

on:
  release:
    types: [released]
  workflow_call: # Called by auto-release before it creates a release (GITHUB_TOKEN-created releases don't fire the `release` event)
    inputs:
      version:
        description: firebase-tools version to build (without leading v)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a real `release` event the version comes from the tag; on workflow_call it's passed in.
      - id: version
        run: echo "value=${{ inputs.version || github.event.release.tag_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v3
        with:
          images: joinflux/firebase-action
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            FIREBASE_VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - id: meta-alpine
        uses: docker/metadata-action@v3
        with:
          images: joinflux/firebase-action
          flavor: |
            suffix=-alpine
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          build-args: |
            FIREBASE_VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
